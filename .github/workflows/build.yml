name: Build Halloween Photobooth APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifier la presence de main.dart
        run: |
          if [ ! -f "main.dart" ]; then
            echo "::error::Le fichier main.dart est INTROUVABLE a la racine du depot GitHub !"
            echo "Veuillez creer le fichier main.dart a la racine et y coller le code Flutter."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Preparer le projet Flutter et les permissions
        run: |
          flutter create --platforms=android --org com.piratepips halloween_photobooth
          cp main.dart halloween_photobooth/lib/main.dart

          mkdir -p halloween_photobooth/assets/frames
          mkdir -p halloween_photobooth/assets/audio
          if [ -d "assets/frames" ]; then cp -r assets/frames/* halloween_photobooth/assets/frames/ || true; fi
          if [ -d "assets/audio" ]; then cp -r assets/audio/* halloween_photobooth/assets/audio/ || true; fi

          cd halloween_photobooth

          # Injection securisee des permissions dans AndroidManifest.xml via Python
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          '''

          if '<uses-permission' not in content:
              content = content.replace('<application', permissions + '    <application')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

          # Configuration universelle minSdk = 21 et compileSdk = 34 (Groovy & Kotlin DSL)
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +

          # Installation automatique de l'ensemble des dependances
          flutter pub add camera image path_provider http shared_preferences audioplayers qr_flutter

      - name: Compiler le fichier APK Release
        working-directory: halloween_photobooth
        run: flutter build apk --release --no-tree-shake-icons

      - name: Televerser l'APK compile
        uses: actions/upload-artifact@v4
        with:
          name: Halloween-Photobooth-APK
          path: halloween_photobooth/build/app/outputs/flutter-apk/app-release.apk
